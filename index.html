<!doctype html>
<html lang="th">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="author" content="Jimmprint" />
    <meta
      name="description"
      content="ร้านพิมพ์งานสถาปัตย์ งานขนาดใหญ่ ตรงข้ามพาต้าปิ่นเกล้า"
    />
    <title>Jimm Print</title>

    <!-- INSTANT PREFERENCE & SESSION SCRIPT -->
    <script>
      if (sessionStorage.getItem("hasLoadedBefore") === "true") {
        document.documentElement.classList.add("already-visited");
      }

      (function () {
        let selectedLang = localStorage.getItem("userLang");
        if (!selectedLang) {
          const browserLang =
            navigator.language || navigator.userLanguage || "";
          selectedLang = browserLang.toLowerCase().startsWith("en")
            ? "en"
            : "th";
        }
        document.documentElement.setAttribute("data-lang", selectedLang);
      })();
    </script>

    <!-- Favicon & Manifest -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/favicon-16x16.png"
    />
    <link rel="manifest" href="/assets/site-CCjZE5-t.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Mobile & Fonts -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Maitree:wght@400;500;700&family=Prompt:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheet & Scripts -->
    <script type="module" crossorigin src="/assets/main-CweF-KpX.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/footer-DCWW2DnQ.js">
    <link rel="stylesheet" crossorigin href="/assets/footer-D9OE8V8Q.css">
    <link rel="stylesheet" crossorigin href="/assets/main-DiGq3jDg.css">
  </head>
  <body>
    <div class="loadingscreen">
      <div class="spinner"></div>

      <!-- Motto -->
      <p class="motto">
        <span data-lang="th">อสุรปาตุภาโว<br />เตโชจิณฺณะโลหะปริปูริโต</span>
        <span data-lang="en"
          >Hoc monstrum generat,<br />tum perficit ignis, et Azoch</span
        >
      </p>

      <div class="enter-container">
        <!-- Thinsnake graphic positioned over/above the enter button -->
        <img
          src="/images/thinsnake.svg"
          alt="Snake Graphic"
          class="enter-graphic"
        />

        <button class="btn-enter">
          <span data-lang="th">เข้าสู่เว็บไซต์</span>
          <span data-lang="en">Enter</span>
        </button>

        <!-- Loading Screen Language Toggle Button -->
        <button
          type="button"
          class="btn-lang lang-switch-btn"
          aria-label="Switch Language"
        >
          <span data-lang="th">English</span>
          <span data-lang="en">ภาษาไทย</span>
        </button>
      </div>
    </div>

    <!-- Reusable Navigation Component -->
    <site-nav></site-nav>

    <div class="burger">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="icon icon-tabler icon-tabler-menu-2"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="var(--clr-accent-100)"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
        <line x1="4" y1="6" x2="20" y2="6"></line>
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="18" x2="20" y2="18"></line>
      </svg>
    </div>

    <div id="experience">
      <div class="loader"></div>
      <canvas id="experience-canvas"></canvas>
    </div>

    <img class="reset-view-button" src="/textures/refresh.webp" alt="RESET" />
    <h1 class="guidetext"></h1>

    <site-footer></site-footer>
  </body>
</html>
